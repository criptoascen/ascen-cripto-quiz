let usedQuestionIds = new Set();
function shuffleOptions(q){const idx=q.options.map((_,i)=>i);for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}return{...q,options:idx.map(i=>q.options[i]),correctAnswer:idx.indexOf(q.correctAnswer)};}
let state={screen:'setup',difficulty:'medium',numQuestions:10,questions:[],current:0,selected:null,revealed:false,score:0,answers:[]};
const LETTERS=['A','B','C','D'],DIFF_LABELS={easy:'Iniciante',medium:'Intermediário',hard:'Avançado'},DIFF_ICONS={easy:'🌱',medium:'⚡',hard:'🔥'};

function selectQuestions(){const pool=QUESTION_BANK.filter(q=>q.difficulty===state.difficulty&&!usedQuestionIds.has(q.id));const shuffled=[...pool].sort(()=>Math.random()-0.5);const picked=shuffled.slice(0,Math.min(state.numQuestions,shuffled.length));picked.forEach(q=>usedQuestionIds.add(q.id));return picked.map(shuffleOptions);}
function getAvailableCount(){return QUESTION_BANK.filter(q=>q.difficulty===state.difficulty&&!usedQuestionIds.has(q.id)).length;}
function startGame(){state.screen='loading';render();setTimeout(()=>{state.questions=selectQuestions();if(state.questions.length===0){QUESTION_BANK.filter(q=>q.difficulty===state.difficulty).forEach(q=>usedQuestionIds.delete(q.id));state.questions=selectQuestions();}state.current=0;state.selected=null;state.revealed=false;state.score=0;state.answers=[];state.screen='playing';render();},800);}
function pickAnswer(i){if(state.revealed)return;state.selected=i;render();}
function checkOrNext(){if(state.selected===null)return;if(!state.revealed){state.revealed=true;const c=state.selected===state.questions[state.current].correctAnswer;state.answers.push({selected:state.selected,correct:c});if(c)state.score++;render();return;}if(state.current+1<state.questions.length){state.current++;state.selected=null;state.revealed=false;render();}else{state.screen='results';render();}}
function resetGame(){state={...state,screen:'setup',questions:[],current:0,selected:null,revealed:false,score:0,answers:[]};render();}

function renderSetup(){const avail=getAvailableCount();return`<div class="card"><div class="logo-wrap"><img src="${LOGO_SRC}" class="logo-img" alt="Ascen Cripto"><div class="logo-sub">Teste seus conhecimentos sobre o universo cripto</div></div><div class="section-label">Dificuldade</div><div class="option-row">${['easy','medium','hard'].map(d=>`<button class="opt-btn ${state.difficulty===d?'active':''}" onclick="state.difficulty='${d}';render();">${DIFF_ICONS[d]} ${DIFF_LABELS[d]}</button>`).join('')}</div><div class="section-label">Perguntas</div><div class="option-row">${[5,10,15,20].map(n=>`<button class="opt-btn ${state.numQuestions===n?'active':''}" onclick="state.numQuestions=${n};render();">${n}</button>`).join('')}</div><div class="unique-badge"><span class="dot"></span> ${avail} perguntas inéditas disponíveis</div><button class="cta-btn" onclick="startGame()">Iniciar Quiz →</button></div>`;}

function renderLoading(){return`<div class="card"><div class="loading-wrap"><div class="spinner"></div><h2>Preparando seu desafio...</h2><p>Selecionando perguntas ${DIFF_LABELS[state.difficulty].toLowerCase()} inéditas</p></div></div>`;}

function renderPlaying(){const q=state.questions[state.current];const pct=((state.current)/state.questions.length*100).toFixed(0);const catClass=q.category==='Smart Contracts'?'Smart':q.category;return`<div class="card fade-in"><div class="header-row"><span class="score-badge">★ ${state.score}</span><img src="${LOGO_SRC}" style="height:36px;opacity:0.7" alt=""></div><div class="progress-wrap"><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><span class="progress-text">${state.current+1}/${state.questions.length}</span></div><span class="cat-tag ${catClass}">${q.category}</span><div class="question-text">${q.question}</div><div class="answer-list">${q.options.map((opt,i)=>{let cls='answer-btn',icon='';if(state.revealed){cls+=' disabled';if(i===q.correctAnswer){cls+=' correct';icon='✓';}else if(i===state.selected){cls+=' wrong';icon='✗';}}else if(state.selected===i)cls+=' selected';return`<button class="${cls}" onclick="pickAnswer(${i})"><span class="letter-badge">${LETTERS[i]}</span><span>${opt}</span>${icon?`<span class="answer-icon">${icon}</span>`:''}</button>`;}).join('')}</div><button class="cta-btn ${state.selected===null?'disabled':''}" onclick="checkOrNext()">${!state.revealed?'Verificar':state.current+1===state.questions.length?'Ver Resultados →':'Próxima →'}</button></div>`;}

function renderResults(){const pct=Math.round((state.score/state.questions.length)*100);let msg='📚 Continue estudando o mercado cripto!';if(pct>=80)msg='🏆 Excelente! Você domina cripto!';else if(pct>=60)msg='👍 Muito bem! Bom conhecimento!';else if(pct>=40)msg='👌 Nada mal! Continue aprendendo!';return`<div class="card fade-in"><div class="logo-wrap"><img src="${LOGO_SRC}" class="logo-img" style="width:80px" alt=""></div><div class="result-score">${state.score}/${state.questions.length}</div><div class="result-pct">${pct}% de acerto</div><div class="result-msg">${msg}</div><div class="section-label">Revisão</div><div class="results-list">${state.questions.map((q,i)=>{const a=state.answers[i];const ok=a&&a.correct;return`<div class="result-item ${ok?'ok':'fail'}"><div class="rq">${ok?'✓':'✗'} ${q.question}</div>${!ok?`<div class="ra red">Sua resposta: ${q.options[a.selected]}</div><div class="ra green">Correta: ${q.options[q.correctAnswer]}</div>`:`<div class="ra green">Resposta correta!</div>`}</div>`;}).join('')}</div><button class="cta-btn" onclick="resetGame()">Jogar Novamente ↺</button></div>`;}

function render(){const app=document.getElementById('app');switch(state.screen){case'setup':app.innerHTML=renderSetup();break;case'loading':app.innerHTML=renderLoading();break;case'playing':app.innerHTML=renderPlaying();break;case'results':app.innerHTML=renderResults();break;}}
render();
</script>
