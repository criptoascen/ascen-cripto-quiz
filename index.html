        .fade-in { animation: fadeIn 0.4s ease; }

        .form-group { margin-bottom: 18px; }
        .form-label { display: block; font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 8px; }
        .form-input { width: 100%; padding: 16px 20px; border-radius: 14px; border: 1.5px solid var(--border-subtle); background: rgba(46,91,118,0.08); color: var(--text-primary); font-family: 'Sora', sans-serif; font-size: 15px; font-weight: 500; transition: all 0.25s; outline: none; }

        .form-privacy { text-align: center; margin-top: 14px; font-size: 11px; color: rgba(143,168,188,0.6); }

        /* WELCOME BACK */

    </style>
</head>

// =====================================================
// HELPERS
// =====================================================
let usedQuestionIds = new Set();
function shuffleOptions(q){
    const idx = q.options.map((_,i)=>i);
    for(let i=idx.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [idx[i],idx[j]] = [idx[j],idx[i]];
    }
    return {...q, options:idx.map(i=>q.options[i]), correctAnswer:idx.indexOf(q.correctAnswer)};
}
function formatTime(seconds){
    const m = Math.floor(seconds/60), s = seconds%60;
    if(m === 0) return s + 's';
    return m + 'min ' + (s<10 ? '0'+s : s) + 's';
}
// Score 0-10: 70% acertos, 30% tempo. Tempo ideal = 15s/pergunta, ruim = 60s+.
// Salvaguarda: tempo só conta se acertar pelo menos 50%.
function calculateScore(acertos, total, tempoSegundos){
    const acertoScore = (acertos/total) * 7;
    const tempoMedio = tempoSegundos/total;
    let tempoScore;
    if(tempoMedio <= 15) tempoScore = 3;
    else if(tempoMedio >= 60) tempoScore = 0;
    else tempoScore = 3 * (1 - (tempoMedio-15)/45);
    if(acertos/total < 0.5) tempoScore = 0;
    return Math.round((acertoScore+tempoScore)*10)/10;
}

// =====================================================
// STATE
// =====================================================
let state = {
    screen: 'setup',  // setup | loading | playing | form | results
    difficulty: 'medium',
    numQuestions: 10,
    questions: [],
    current: 0,
    selected: null,
    revealed: false,
    score: 0,
    answers: [],
    leadData: { nome:'', telefone:'', email:'' },
    hasStoredLead: false,
    elapsedSeconds: 0,
    startTime: null,
    timerInterval: null,
};

const LETTERS = ['A','B','C','D'];
const DIFF_LABELS = {easy:'Iniciante', medium:'Intermediário', hard:'Avançado'};
const DIFF_ICONS = {easy:'🌱', medium:'⚡', hard:'🔥'};

// Carrega lead do localStorage no boot
try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
        const parsed = JSON.parse(raw);
        if(parsed && parsed.email){
            state.leadData = {nome:parsed.nome||'', telefone:parsed.telefone||'', email:parsed.email||''};
            state.hasStoredLead = true;
        }
    }
} catch(e) { /* ignore */ }

// =====================================================
// QUESTION SELECTION
// =====================================================
function selectQuestions(){
    const pool = QUESTION_BANK.filter(q => q.difficulty === state.difficulty && !usedQuestionIds.has(q.id));
    const shuffled = [...pool].sort(()=>Math.random()-0.5);
    const picked = shuffled.slice(0, Math.min(state.numQuestions, shuffled.length));
    picked.forEach(q => usedQuestionIds.add(q.id));
    return picked.map(shuffleOptions);
}

// =====================================================
// GAME FLOW
// =====================================================
function startGame(){
    state.screen = 'loading';
    render();
    setTimeout(() => {
        state.questions = selectQuestions();
        if(state.questions.length === 0){
            // Esgotou perguntas pra essa dificuldade — reseta o pool dessa dificuldade
            QUESTION_BANK.filter(q => q.difficulty === state.difficulty).forEach(q => usedQuestionIds.delete(q.id));
            state.questions = selectQuestions();
        }
        state.current = 0;
        state.selected = null;
        state.revealed = false;
        state.score = 0;
        state.answers = [];
        state.elapsedSeconds = 0;
        state.startTime = Date.now();
        state.screen = 'playing';
        // Inicia cronômetro
        if(state.timerInterval) clearInterval(state.timerInterval);
        state.timerInterval = setInterval(() => {
            state.elapsedSeconds = Math.floor((Date.now()-state.startTime)/1000);
            updateTimer();
        }, 1000);
        render();
    }, 800);
}

function updateTimer(){
    const el = document.getElementById('timer-badge');
    if(el) el.textContent = '⏱ ' + formatTime(state.elapsedSeconds);
}

function pickAnswer(i){
    if(state.revealed) return;
    state.selected = i;
    render();
}

function checkOrNext(){
    if(state.selected === null) return;
    if(!state.revealed){
        state.revealed = true;
        const c = state.selected === state.questions[state.current].correctAnswer;
        state.answers.push({selected:state.selected, correct:c});
        if(c) state.score++;
        render();
        return;
    }
    if(state.current+1 < state.questions.length){
        state.current++;
        state.selected = null;
        state.revealed = false;
        render();
    } else {
        // Acabou: para cronômetro
        if(state.timerInterval) clearInterval(state.timerInterval);
        // Vai pro form ou direto pro resultado
        state.screen = state.hasStoredLead ? 'results' : 'form';
        render();
    }
}

function resetGame(){
    if(state.timerInterval) clearInterval(state.timerInterval);
    state.screen = 'setup';
    state.questions = [];
    state.current = 0;
    state.selected = null;
    state.revealed = false;
    state.score = 0;
    state.answers = [];
    state.elapsedSeconds = 0;
    state.startTime = null;
    render();
}

// =====================================================
// LEAD FORM
// =====================================================
function submitLeadForm(){
    const nome = document.getElementById('lead-nome').value.trim();
    const telefone = document.getElementById('lead-telefone').value.trim();
    const email = document.getElementById('lead-email').value.trim();
    let valid = true;

    if(!nome){
        document.getElementById('err-nome').classList.add('visible');
        document.getElementById('lead-nome').classList.add('error');
        valid = false;
    }
    const telClean = telefone.replace(/\D/g,'');
    if(telClean.length < 10){
        document.getElementById('err-telefone').classList.add('visible');
        document.getElementById('lead-telefone').classList.add('error');
        valid = false;
    }
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if(!emailRegex.test(email)){
        document.getElementById('err-email').classList.add('visible');
        document.getElementById('lead-email').classList.add('error');
        valid = false;
    }
    if(!valid) return;

    state.leadData = {nome, telefone, email};

    // Calcula score e nível pra mandar junto pro Google Form
    const finalScore = calculateScore(state.score, state.questions.length, state.elapsedSeconds);
    const nivel = NIVEL_LABEL[state.difficulty] || state.difficulty;

    // Envia pro Google Form via iframe oculto (não bloqueia o resultado se falhar)
    sendToGoogleForms(nome, telefone, email, finalScore, nivel);

    // Salva no localStorage pra não pedir de novo
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
            nome, telefone, email,
            savedAt: new Date().toISOString()
        }));
        state.hasStoredLead = true;
    } catch(e) { /* ignore */ }

    state.screen = 'results';
    render();
}

function sendToGoogleForms(nome, telefone, email, score, nivel){
    const params = new URLSearchParams();
    params.append(FORM_ENTRIES.nome, nome);
    params.append(FORM_ENTRIES.telefone, telefone);
    params.append(FORM_ENTRIES.email, email);
    if(score !== undefined && score !== null) params.append(FORM_ENTRIES.score, score);
    if(nivel) params.append(FORM_ENTRIES.nivel, nivel);
    const url = GOOGLE_FORM_URL + '?' + params.toString();

    const iframe = document.createElement('iframe');
    iframe.name = 'hidden_iframe_lead';
    iframe.style.display = 'none';
    document.body.appendChild(iframe);
    iframe.src = url;
    setTimeout(() => { if(iframe.parentNode) iframe.parentNode.removeChild(iframe); }, 5000);
}

function formatPhone(input){
    let val = input.value.replace(/\D/g,'');
    if(val.length > 11) val = val.slice(0,11);
    if(val.length > 6){
        input.value = '(' + val.slice(0,2) + ') ' + val.slice(2,7) + '-' + val.slice(7);
    } else if(val.length > 2){
        input.value = '(' + val.slice(0,2) + ') ' + val.slice(2);
    } else if(val.length > 0){
        input.value = '(' + val;
    } else {
        input.value = '';
    }
}

function renderSetup(){
    const welcomeName = state.leadData.nome ? state.leadData.nome.split(' ')[0] : '';
    const welcomeBack = state.hasStoredLead && welcomeName
        ? `<div class="welcome-back">Bem-vindo de volta, <strong>${welcomeName}</strong> 👋</div>`
        : '';
    return `<div class="card animate-in">
        <div class="logo-wrap">
            <img src="${LOGO_SRC}" class="logo-img" alt="Ascen Cripto">
            <div class="logo-sub">Teste seus conhecimentos sobre o universo cripto</div>
        </div>
        ${welcomeBack}
        <div class="section-label">Dificuldade</div>
        <div class="option-row">
            ${['easy','medium','hard'].map(d => `<button class="opt-btn ${state.difficulty===d?'active':''}" onclick="state.difficulty='${d}';render();">${DIFF_ICONS[d]} ${DIFF_LABELS[d]}</button>`).join('')}
        </div>
        <div class="section-label">Perguntas</div>
        <div class="option-row">
            ${[5,10,20,30].map(n => `<button class="opt-btn ${state.numQuestions===n?'active':''}" onclick="state.numQuestions=${n};render();">${n}</button>`).join('')}
        </div>
        <button class="cta-btn" onclick="startGame()">Iniciar Quiz →</button>
    </div>`;
}

function renderLoading(){
    return `<div class="card"><div class="loading-wrap"><div class="spinner"></div><h2>Preparando seu desafio...</h2><p>Selecionando perguntas inéditas</p></div></div>`;
}

function renderPlaying(){
    const q = state.questions[state.current];
    const pct = ((state.current)/state.questions.length*100).toFixed(0);
    const catClass = q.category === 'Smart Contracts' ? 'Smart' : q.category;
    return `<div class="card">
        <div class="header-row">
            <div class="badge-group">
                <span class="score-badge">★ ${state.score}</span>
                <span class="timer-badge" id="timer-badge">⏱ ${formatTime(state.elapsedSeconds)}</span>
            </div>
            <img src="${LOGO_SRC}" style="height:36px;opacity:0.7" alt="">
        </div>
        <div class="progress-wrap">
            <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
            <span class="progress-text">${state.current+1}/${state.questions.length}</span>
        </div>
        <span class="cat-tag ${catClass}">${q.category}</span>
        <div class="question-text">${q.question}</div>
        <div class="answer-list">
            ${q.options.map((opt,i) => {
                let cls = 'answer-btn', icon = '';
                if(state.revealed){
                    cls += ' disabled';
                    if(i === q.correctAnswer){ cls += ' correct'; icon = '✓'; }
                    else if(i === state.selected){ cls += ' wrong'; icon = '✗'; }
                } else if(state.selected === i) cls += ' selected';
                return `<button class="${cls}" onclick="pickAnswer(${i})"><span class="letter-badge">${LETTERS[i]}</span><span>${opt}</span>${icon ? `<span class="answer-icon">${icon}</span>` : ''}</button>`;
            }).join('')}
        </div>
        <button class="cta-btn ${state.selected===null?'disabled':''}" onclick="checkOrNext()">${!state.revealed ? 'Verificar' : (state.current+1 === state.questions.length ? 'Ver Resultado →' : 'Próxima →')}</button>
    </div>`;
}

function renderForm(){
    return `<div class="card animate-in">
        <div class="logo-wrap">
            <img src="${LOGO_SRC}" class="logo-img" alt="Ascen Cripto">
        </div>
        <div class="lead-intro">
            <h2>Quase lá!</h2>
            <p>Preencha rapidinho pra desbloquear seu resultado.<br>Você só precisa fazer isso uma vez.</p>
        </div>
        <div class="form-group">
            <label class="form-label" for="lead-nome">Nome</label>
            <input class="form-input" type="text" id="lead-nome" placeholder="Seu nome completo" autocomplete="name">
            <div class="form-error" id="err-nome">Por favor, insira seu nome</div>
        </div>
        <div class="form-group">
            <label class="form-label" for="lead-telefone">WhatsApp / Telefone</label>
            <input class="form-input" type="tel" id="lead-telefone" placeholder="(00) 00000-0000" autocomplete="tel" oninput="formatPhone(this)">
            <div class="form-error" id="err-telefone">Insira um número válido com DDD</div>
        </div>
        <div class="form-group">
            <label class="form-label" for="lead-email">E-mail</label>
            <input class="form-input" type="email" id="lead-email" placeholder="seu@email.com" autocomplete="email">
            <div class="form-error" id="err-email">Insira um e-mail válido</div>
        </div>
        <button class="cta-btn" onclick="submitLeadForm()">Ver meu resultado →</button>
        <div class="form-privacy">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            Seus dados estão seguros. Apenas a Ascen Cripto verá.
        </div>
    </div>`;
}

function renderResults(){
    const finalScore = calculateScore(state.score, state.questions.length, state.elapsedSeconds);
    const pct = Math.round((state.score/state.questions.length)*100);
    const tempoMedio = Math.round(state.elapsedSeconds/state.questions.length);

    let msg, emoji;
    if(finalScore >= 9){ msg = 'Excepcional. Você domina cripto.'; emoji = '🏆'; }
    else if(finalScore >= 7){ msg = 'Muito bom. Você manja do assunto.'; emoji = '🎯'; }
    else if(finalScore >= 5){ msg = 'Razoável. Tem base, dá pra aprofundar.'; emoji = '📈'; }
    else if(finalScore >= 3){ msg = 'Tá começando. Continue estudando o mercado.'; emoji = '📚'; }
    else { msg = 'Hora de mergulhar nos fundamentos.'; emoji = '🔍'; }

    return `<div class="card">
        <div class="logo-wrap">
            <img src="${LOGO_SRC}" class="logo-img" style="width:80px" alt="">
        </div>
        <div class="score-circle-wrap">
            <div class="score-circle">
                <div class="score-emoji">${emoji}</div>
                <div class="score-number">${finalScore.toFixed(1)}</div>
                <div class="score-of">DE 10</div>
            </div>
        </div>
        <div class="result-msg">${msg}</div>
        <div class="result-stats">
            <div class="stat-card">
                <div class="stat-label">Acertos</div>
                <div class="stat-value">${state.score}/${state.questions.length}</div>
                <div class="stat-sub">${pct}%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Tempo total</div>
                <div class="stat-value gold">${formatTime(state.elapsedSeconds)}</div>
                <div class="stat-sub">${tempoMedio}s/pergunta</div>
            </div>
        </div>
        <div class="section-label">Revisão</div>
        <div class="results-list">
            ${state.questions.map((q,i) => {
                const a = state.answers[i];
                const ok = a && a.correct;
                return `<div class="result-item ${ok?'ok':'fail'}">
                    <div class="rq">${ok?'✓':'✗'} ${q.question}</div>
                    ${!ok ? `<div class="ra red">Sua resposta: ${q.options[a.selected]}</div><div class="ra green">Correta: ${q.options[q.correctAnswer]}</div>` : `<div class="ra green">Resposta correta!</div>`}
                </div>`;
            }).join('')}
        </div>
        <button class="cta-btn" onclick="resetGame()">Jogar Novamente ↺</button>
    </div>`;
}

let prevScreen = null, prevQuestion = -1;
function render(){
    const app = document.getElementById('app');
    let html = '';
    switch(state.screen){
        case 'setup': html = renderSetup(); break;
        case 'loading': html = renderLoading(); break;
        case 'playing': html = renderPlaying(); break;
        case 'form': html = renderForm(); break;
        case 'results': html = renderResults(); break;
    }
    app.innerHTML = html;
    const shouldAnimate = (state.screen !== prevScreen) || (state.screen === 'playing' && state.current !== prevQuestion);
    if(shouldAnimate){
        const card = app.querySelector('.card');
        if(card) card.classList.add('animate-in');
    }
    prevScreen = state.screen;
    prevQuestion = state.current;
}

render();
</script>
</body>
</html>
